<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6eedf">
  <title>合成银新</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script defer src="main.js"></script>
</head>
<body>
  <div id="loading-screen" class="loading-screen" role="dialog" aria-modal="true" aria-labelledby="loading-title">
    <div class="loading-card">
      <span class="loading-sparkle" aria-hidden="true">✦</span>
      <p class="eyebrow">A LITTLE GAME OF MERGING</p>
      <h2 id="loading-title">银新正在准备中</h2>
      <p id="loading-status" class="loading-status" role="status" aria-live="polite">正在加载游戏图片…</p>
      <div class="loading-progress" role="progressbar" aria-label="图片加载进度" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
        <span id="loading-progress-bar"></span>
      </div>
      <p id="loading-count" class="loading-count">0 / 10</p>
      <button id="start-button" type="button" disabled>正在加载…</button>
    </div>
  </div>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">A LITTLE GAME OF MERGING</p>
      <h1>合成银新</h1>
      <p class="subtitle">银新叠叠乐，合成大银新！</p>
    </header>

    <section class="game-shell" aria-label="合成银新游戏">
      <div class="game-topbar">
        <div class="score-box" aria-live="polite">
          <span class="score-label">得分</span>
          <strong id="score">0</strong>
        </div>
      </div>
      <div class="board-wrap">
        <canvas id="game-canvas" width="400" height="600" aria-label="游戏区域"></canvas>
        <div id="game-over" class="game-over" hidden>
          <div class="result-card">
            <span class="result-sparkle" aria-hidden="true">✦</span>
            <p id="result-eyebrow" class="eyebrow">ONE MORE ROUND?</p>
            <h2 id="result-title">银新叠得太高了啊喂！</h2>
            <p class="result-label">本局得分</p>
            <strong id="final-score">0</strong>
            <button id="restart-button" type="button">再来一局 <span aria-hidden="true">↗</span></button>
          </div>
        </div>
      </div>
    </section>
    <p class="hint">移动鼠标或手指调整位置 · 点击 / 触摸 / 空格键投放</p>
    <footer>小心别让银银新新堆过红线哦</footer>
  </main>
</body>
</html>
